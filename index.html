    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #050505;
        font-family: 'Inter', sans-serif;
        color: #ffffff;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, .brand-font {
        font-family: 'Montserrat', sans-serif;
      }
      
      /* Modern Reveal Animation */
      @keyframes reveal-up {
        0% {
          opacity: 0;
          transform: translateY(40px) scale(0.96);
          filter: blur(12px);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }
      
      .animate-reveal {
        opacity: 0; /* Initially hidden */
        animation: reveal-up 1.0s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        will-change: transform, opacity, filter;
      }

      /* Rotating Border Animation */
      @keyframes spin-slow {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .animate-spin-slow {
        animation: spin-slow 4s linear infinite;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #262626;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #404040;
      }
    </style>
